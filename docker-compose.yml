      auth-service:
        condition: service_started
      wallet-service:
        condition: service_started
      clanwars-migrator:
        condition: service_completed_successfully
    restart: always

  # Dev stand-in for the Unity game server (backend/tools/FakeGameServer).
  fake-game-server:
    container_name: gameserver-v2-fake-game-server
    build:
      context: ./backend
      dockerfile: tools/FakeGameServer/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ServiceAuth__Authority=http://auth-service:8080/
      - FakeGameServer__SessionGrpcAddress=http://session-service:8081
      - FakeGameServer__ServerId=00000000-0000-0000-0000-00000000f001
      - FakeGameServer__PublicAddress=localhost:5291
    ports:
      - "5291:8080"
    depends_on:
      auth-service:
        condition: service_started
      session-service:
        condition: service_started
    restart: always

  realtime-service:
    container_name: gameserver-v2-realtime-service
    build:
      context: ./backend
      dockerfile: RealtimeService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: always

  postgres:
    container_name: gameserver-v2-postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5436, чтобы не конфликтовать с GameServer (5435).
      - "5436:5432"
    volumes:
      - gameserver-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: gameserver-v2-rabbitmq
    image: rabbitmq:4-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - gameserver-v2-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: gameserver-v2-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - gameserver-v2-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: gameserver-v2-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Единый API-origin: и OIDC (AuthService), и JSON API идут через nginx.
        NEXT_PUBLIC_API_URL: https://localhost:6101
    # Наружу не публикуется: вход в приложение — через nginx
    # (https://localhost:6100).
    expose:
      - "3000"
    restart: always

  nginx:
    container_name: gameserver-v2-nginx
    image: nginx:alpine
    ports:
      # 6100 — SPA, 6101 — API (AuthService в корне). GameServer занимает 5000/5001.
      - "6100:6100"
      - "6101:6101"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certificates:/etc/nginx/certificates:ro
    depends_on:
      - auth-service
      - profile-service
      - wallet-service
      - catalog-service
      - inventory-service
      - store-service
      - event-service
      - matchmaking-service
      - session-service
      - clan-service
      - clanwars-service
      - realtime-service
      - frontend
    restart: always

secrets:
  nuget_password:
    environment: NUGET_PASSWORD

volumes:
  gameserver-v2-postgres-data:
  gameserver-v2-rabbitmq-data:
  gameserver-v2-redis-data:
