services:
  auth-migrator:
    container_name: gameserver-v2-auth-migrator
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__AuthDb=${ConnectionStrings__AuthDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__AuthDb}"]
    restart: "no"

  auth-service:
    container_name: gameserver-v2-auth-service
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__AuthDb=${ConnectionStrings__AuthDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-migrator:
        condition: service_completed_successfully
    restart: always

