services:
  auth-migrator:
    container_name: gameserver-v2-auth-migrator
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__AuthDb=${ConnectionStrings__AuthDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__AuthDb}"]
    restart: "no"

  auth-service:
    container_name: gameserver-v2-auth-service
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__AuthDb=${ConnectionStrings__AuthDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-migrator:
        condition: service_completed_successfully
    restart: always

  profile-migrator:
    container_name: gameserver-v2-profile-migrator
    build:
      context: ./backend
      dockerfile: ProfileService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__ProfileDb=${ConnectionStrings__ProfileDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__ProfileDb}"]
    restart: "no"

  profile-service:
    container_name: gameserver-v2-profile-service
    build:
      context: ./backend
      dockerfile: ProfileService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__ProfileDb=${ConnectionStrings__ProfileDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-migrator:
        condition: service_completed_successfully
    restart: always

  wallet-migrator:
    container_name: gameserver-v2-wallet-migrator
    build:
      context: ./backend
      dockerfile: WalletService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__WalletDb=${ConnectionStrings__WalletDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__WalletDb}"]
    restart: "no"

  wallet-service:
    container_name: gameserver-v2-wallet-service
    build:
      context: ./backend
      dockerfile: WalletService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__WalletDb=${ConnectionStrings__WalletDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-migrator:
        condition: service_completed_successfully
    restart: always

  catalog-migrator:
    container_name: gameserver-v2-catalog-migrator
    build:
      context: ./backend
      dockerfile: CatalogService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__CatalogDb=${ConnectionStrings__CatalogDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__CatalogDb}"]
    restart: "no"

  catalog-service:
    container_name: gameserver-v2-catalog-service
    build:
      context: ./backend
      dockerfile: CatalogService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__CatalogDb=${ConnectionStrings__CatalogDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-migrator:
        condition: service_completed_successfully
    restart: always

  inventory-migrator:
    container_name: gameserver-v2-inventory-migrator
    build:
      context: ./backend
      dockerfile: InventoryService/Dockerfile
      target: migrations
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__InventoryDb=${ConnectionStrings__InventoryDb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", "${ConnectionStrings__InventoryDb}"]
    restart: "no"

  inventory-service:
    container_name: gameserver-v2-inventory-service
    build:
      context: ./backend
      dockerfile: InventoryService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__InventoryDb=${ConnectionStrings__InventoryDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-migrator:
        condition: service_completed_successfully
    restart: always

  postgres:
    container_name: gameserver-v2-postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5436, чтобы не конфликтовать с GameServer (5435).
      - "5436:5432"
    volumes:
      - gameserver-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: gameserver-v2-rabbitmq
    image: rabbitmq:4-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - gameserver-v2-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: gameserver-v2-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - gameserver-v2-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: gameserver-v2-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Единый API-origin: и OIDC (AuthService), и JSON API идут через nginx.
        NEXT_PUBLIC_API_URL: https://localhost:6101
    # Наружу не публикуется: вход в приложение — через nginx
    # (https://localhost:6100).
    expose:
      - "3000"
    restart: always

  nginx:
    container_name: gameserver-v2-nginx
    image: nginx:alpine
    ports:
      # 6100 — SPA, 6101 — API (AuthService в корне). GameServer занимает 5000/5001.
      - "6100:6100"
      - "6101:6101"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certificates:/etc/nginx/certificates:ro
    depends_on:
      - auth-service
      - profile-service
      - wallet-service
      - catalog-service
      - inventory-service
      - frontend
    restart: always

secrets:
  nuget_password:
    environment: NUGET_PASSWORD

volumes:
  gameserver-v2-postgres-data:
  gameserver-v2-rabbitmq-data:
  gameserver-v2-redis-data:
