    command: ["--connection", "${ConnectionStrings__SessionDb}"]
    restart: "no"

  # REST for players on 8080 (through nginx), gRPC for game servers on 8081 (internal only).
  session-service:
    container_name: gameserver-v2-session-service
    build:
      context: ./backend
      dockerfile: SessionService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
      secrets:
        - nuget_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__SessionDb=${ConnectionStrings__SessionDb}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
      # Empty in dev: an ephemeral key is generated. In production the PEM comes from Lockbox.
      - JoinTickets__SigningKeyPem=${SESSION_TICKET_SIGNING_KEY_PEM:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      session-migrator:
