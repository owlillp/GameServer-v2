events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream template_service {
        server template-service:8080;
    }

    # SPA. HTTPS обязателен для OIDC: browser session cookie не должна идти по HTTP.
    server {
        listen 6000 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API TemplateService. `Host $http_host` сохраняет внешний порт в ссылках.
    server {
        listen 6001 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://template_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
