events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # server_port в логе — чтобы сразу видеть, на какой из портов пришёл запрос.
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent port=$server_port "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:8080;
    }

    upstream profile_service {
        server profile-service:8080;
    }

    # SPA. HTTPS обязателен для OIDC: browser session cookie не должна идти по HTTP.
    # Порт 6100, а не 6000: 6000 — X11-порт, браузеры блокируют его как unsafe
    # (запрос не уходит вовсе, виден только белый экран), при этом curl работает.
    server {
        listen 6100 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Единый API-origin: OIDC (/connect, /.well-known) и JSON API (/auth/*, /admin/*)
    # AuthService живут в корне. `Host $http_host` сохраняет внешний порт 6101,
    # который входит в OIDC issuer.
    #
    # Будущие сервисы подключаются отдельными location по префиксу
    # (по аналогии с GameServer: /clans → clan-service).
    server {
        listen 6101 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Корень API в браузере уводит в UI: у OpenIddict на `/` нет эндпоинта,
        # он отвечает пустым 401, который выглядит как «белый экран».
        location = / {
            return 302 https://localhost:6100/;
        }

        # ProfileService — отдельным префиксом (/profiles/*).
        location /profiles {
            proxy_pass http://profile_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
