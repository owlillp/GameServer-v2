events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # server_port в логе — чтобы сразу видеть, на какой из портов пришёл запрос.
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent port=$server_port "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:8080;
    }

    upstream profile_service {
        server profile-service:8080;
    }

    upstream wallet_service {
        server wallet-service:8080;
    }

    upstream catalog_service {
        server catalog-service:8080;
    }

    upstream inventory_service {
        server inventory-service:8080;
    }

    upstream store_service {
        server store-service:8080;
    }

    upstream event_service {
        server event-service:8080;
    }

    upstream matchmaking_service {
        server matchmaking-service:8080;
    }

    upstream clan_service {
        server clan-service:8080;
    }

    upstream session_service {
        server session-service:8080;
    }

    upstream realtime_service {
        server realtime-service:8080;
    }

    # SPA. HTTPS обязателен для OIDC: browser session cookie не должна идти по HTTP.
    # Порт 6100, а не 6000: 6000 — X11-порт, браузеры блокируют его как unsafe
    # (запрос не уходит вовсе, виден только белый экран), при этом curl работает.
    server {
        listen 6100 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Единый API-origin: OIDC (/connect, /.well-known) и JSON API (/auth/*, /admin/*)
    # AuthService живут в корне. `Host $http_host` сохраняет внешний порт 6101,
    # который входит в OIDC issuer.
    #
    # Будущие сервисы подключаются отдельными location по префиксу
    # (по аналогии с GameServer: /clans → clan-service).
    server {
        listen 6101 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Корень API в браузере уводит в UI: у OpenIddict на `/` нет эндпоинта,
        # он отвечает пустым 401, который выглядит как «белый экран».
        location = / {
            return 302 https://localhost:6100/;
        }

        # ProfileService — отдельным префиксом (/profiles/*).
        location /profiles {
            proxy_pass http://profile_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # WalletService — отдельным префиксом (/wallets/*).
        location /wallets {
            proxy_pass http://wallet_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Админские операции над кошельками живут в WalletService, но под /admin/*:
        # более специфичный префикс перебивает `location /` (AuthService).
        location /admin/wallets {
            proxy_pass http://wallet_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # CatalogService — отдельным префиксом (/catalog/*).
        location /catalog {
            proxy_pass http://catalog_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Админский каталог (/admin/catalog/*).
        location /admin/catalog {
            proxy_pass http://catalog_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # InventoryService — префикс /inventory/*.
        location /inventory {
            proxy_pass http://inventory_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # StoreService — витрина, покупки и история заказов (/store/*).
        location /store {
            proxy_pass http://store_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Админский магазин (/admin/store/*).
        location /admin/store {
            proxy_pass http://store_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Админский инвентарь (/admin/inventory/*).
        # RealtimeService - SignalR hub and one-time ticket endpoint.
        location /realtime {
            proxy_pass http://realtime_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # EventService - published events and player progress (/events/*).
        location /events {
            proxy_pass http://event_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # EventService - admin API (/admin/events/*).
        location /admin/events {
            proxy_pass http://event_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # MatchmakingService - parties, queue, matches and leaderboard (/matchmaking/*).
        location /matchmaking {
            proxy_pass http://matchmaking_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # ClanService - clans, roster, requests and invites (/clans/*).
        location /clans {
            proxy_pass http://clan_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # ClanService - admin API (/admin/clans/*).
        location /admin/clans {
            proxy_pass http://clan_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # SessionService - open-world join and join tickets (/sessions/*).
        # gRPC for game servers (port 8081) is internal and not proxied.
        location /sessions {
            proxy_pass http://session_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # SessionService - admin API (/admin/sessions/*).
        location /admin/sessions {
            proxy_pass http://session_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # MatchmakingService - admin API (/admin/matchmaking/*).
        location /admin/matchmaking {
            proxy_pass http://matchmaking_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /admin/inventory {
            proxy_pass http://inventory_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
