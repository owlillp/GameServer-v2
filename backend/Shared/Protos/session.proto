syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Session";

package session.v1;

import "google/protobuf/timestamp.proto";

// Contract between game servers and SessionService.
// Callers authenticate with a client_credentials token that has the session.write scope.
service GameServerSessions {
  // Registers (or re-registers) a server and returns the heartbeat settings.
  rpc Register (RegisterRequest) returns (RegisterReply);

  // Client streaming: each message extends the server and its sessions in the live registry.
  rpc Heartbeat (stream HeartbeatRequest) returns (HeartbeatReply);

  // Checks a player's join ticket when the player connects to the server.
  rpc ValidateJoinTicket (ValidateJoinTicketRequest) returns (ValidateJoinTicketReply);

  rpc PlayerJoined (PlayerJoinedRequest) returns (PlayerEventReply);
  rpc PlayerLeft (PlayerLeftRequest) returns (PlayerEventReply);

  // Final result of a match or another scored activity. Idempotent by activity_id.
  rpc ReportMatch (ReportMatchRequest) returns (ReportMatchReply);
}

// Service-to-service API (matchmaking). Callers need the session scope.
service MatchSessions {
  // Join ticket for a participant of a queued match whose session is allocated.
  rpc IssueMatchTicket (IssueMatchTicketRequest) returns (IssueMatchTicketReply);
}

message IssueMatchTicketRequest {
  string match_id = 1;
  string account_id = 2;
}

message IssueMatchTicketReply {
  bool success = 1;
  string session_id = 2;
  string server_address = 3;
  string ticket = 4;
  google.protobuf.Timestamp expires_at = 5;
  string error_code = 6;
  string error_message = 7;
}

message RegisterRequest {
  string server_id = 1;
  string address = 2;
  string region = 3;
  repeated string modes = 4;
  int32 capacity = 5;
}

message RegisterReply {
  string server_id = 1;
  int32 heartbeat_interval_seconds = 2;
  string ticket_public_key_pem = 3;
  string ticket_key_id = 4;
}

message HeartbeatRequest {
  string server_id = 1;
  repeated string session_ids = 2;
  int32 player_count = 3;
}

message HeartbeatReply {
  int32 received = 1;
}

message ValidateJoinTicketRequest {
  string server_id = 1;
  string ticket = 2;
}

message ValidateJoinTicketReply {
  bool valid = 1;
  string account_id = 2;
  string session_id = 3;
  string kind = 4;
  string mode = 5;
  string match_id = 6;
  string error_code = 7;
  string error_message = 8;
}

message PlayerJoinedRequest {
  string server_id = 1;
  string session_id = 2;
  string account_id = 3;
}

message PlayerLeftRequest {
  string server_id = 1;
  string session_id = 2;
  string account_id = 3;
}

message PlayerEventReply {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}

message ReportMatchRequest {
  string server_id = 1;
  string session_id = 2;
  // Unique id of the reported activity, generated by the game server. Retries reuse it.
  string activity_id = 3;
  string mode = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  repeated PlayerResult players = 7;
  // Free-form statistics kept with the raw report for disputes and anti-cheat.
  string stats_json = 8;
}

message PlayerResult {
  string account_id = 1;
  int32 team = 2;
  int32 score = 3;
  int32 kills = 4;
  int32 deaths = 5;
  bool is_winner = 6;
}

message ReportMatchReply {
  bool accepted = 1;
  bool duplicate = 2;
  bool suspicious = 3;
  string error_code = 4;
  string error_message = 5;
}
